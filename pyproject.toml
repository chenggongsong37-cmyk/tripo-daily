[project]
name = "tripo-daily"
version = "0.1.0"
description = "Tripo AI / VAST industry intelligence daily report"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "python-dotenv>=1.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tripo-daily = "tripo_daily.cli:main"
tripo-daily-web = "tripo_daily.web:main"

[tool.setuptools.packages.find]
include = ["tripo_daily*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
